services:
  - type: web
    name: finomaly-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Requires manual entry in the Render dashboard for security
      - key: CORS_ORIGINS
        value: "https://your-vercel-frontend-url.vercel.app" # To be updated once frontend is deployed
      - key: PYTHON_VERSION
        value: "3.11.0"
